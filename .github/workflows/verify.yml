# The gate this repository's claims depend on.
#
# Runs on windows-latest because the checks shell out to powershell.exe, which does not
# exist on ubuntu-latest. Verified by a failing run: "spawn powershell.exe ENOENT" on
# almost every tool. A cross-platform promise needs cross-platform code, not a Linux runner.
#
# No `cache:` here either: this repository ships a pnpm lockfile and no package-lock.json,
# and setup-node's `cache: npm` fails outright with "Dependencies lock file is not found".
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # A cold powershell.exe costs ~20s on a fresh runner, which every check would
      # otherwise pay separately.
      - name: Warm PowerShell
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.Major'

      - name: Verify
        run: npm run verify
