# The gate this repository's claims depend on.
#
# No `cache:` here: this repository ships a pnpm lockfile and no package-lock.json, and
# setup-node's `cache: npm` fails outright with "Dependencies lock file is not found".
# Caching is an optimisation; correctness first.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run verify
